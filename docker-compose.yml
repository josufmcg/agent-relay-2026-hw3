services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d agent_relay"]
      interval: 2s
      timeout: 5s
      retries: 15

  agent-relay:
    image: agent-relay:local
    build:
      context: .
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/agent_relay
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"

volumes:
  postgres-data: